name: Compilar APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: $RUNNER_TOOL_CACHE/android-sdk

    steps:
      # 1) Clonar el repositorio
      - name: Clonar el repositorio
        uses: actions/checkout@v3

      # 2) Configurar Java
      - name: Configurar Java (Temurin 17)
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      # 3) Instalar Android SDK y herramientas
      - name: Instalar Android SDK y herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget
          wget https://dl.google.com/android/repository/commandlinetools-linux-9123335_latest.zip -O cmdline-tools.zip
          sudo unzip cmdline-tools.zip -d $ANDROID_SDK_ROOT
          yes | $ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      # 4) Dar permiso de ejecución al wrapper
      - name: Dar permiso de ejecución al Gradle Wrapper
        run: chmod +x ./gradlew

      # 5) Compilar APK en modo Release
      - name: Compilar APK (release)
        run: ./gradlew assembleRelease

      # 6) Subir APK como artefacto
      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v2
        with:
          name: MealPlanner-release-apk
          path: app/build/outputs/apk/release/app-release.apk
+
